<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จองโต๊ะ | Chen Cafe</title>
    <link rel="icon" href="favicon-32x32.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background: #f5f5f5;
        }
        .bg {
            background: url('ARK.png') no-repeat;
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg">

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">จองโต๊ะล่วงหน้า</h3>
                    <form>
                        <!-- ชื่อ -->
                        <div class="mb-3">
                            <label class="form-label">ชื่อผู้จอง</label>
                            <input type="text" class="form-control" placeholder="กรุณากรอกชื่อ" required>
                        </div>

                        <!-- เบอร์โทร -->
                        <div class="mb-3">
                            <label class="form-label">เบอร์โทรศัพท์</label>
                            <input type="tel" class="form-control" placeholder="08xxxxxxxx" required>
                        </div>

                        <!-- วันที่ -->
                        <div class="mb-3">
                            <label class="form-label">วันที่จอง</label>
                            <input type="date" class="form-control" required>
                        </div>

                        <!-- เวลา -->
                        <div class="mb-3">
                            <label class="form-label">เวลา</label>
                            <input type="time" class="form-control" required>
                        </div>

                        <!-- จำนวนคน -->
                        <div class="mb-3">
                            <label class="form-label">จำนวนลูกค้า</label>
                            <select class="form-select" required>
                                <option value="">เลือกจำนวน</option>
                                <option>1 คน</option>
                                <option>2 คน</option>
                                <option>3-4 คน</option>
                                <option>5-6 คน</option>
                                <option>มากกว่า 6 คน</option>
                            </select>
                        </div>

                        <!-- โซน -->
                        <div class="mb-3">
                            <label class="form-label">โซนที่นั่ง</label>
                            <select class="form-select">
                                <option>ภายในร้าน</option>
                                <option>ด้านนอก</option>
                                <option>ใกล้หน้าต่าง</option>
                                <option>ไม่ระบุ</option>
                            </select>
                        </div>

                        <!-- หมายเหตุ -->
                        <div class="mb-3">
                            <label class="form-label">หมายเหตุเพิ่มเติม</label>
                            <textarea class="form-control" rows="3" placeholder="เช่น ขอที่นั่งติดปลั๊กไฟ"></textarea>
                        </div>

                        <!-- ปุ่ม -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-warning text-dark fw-bold">
                                ยืนยันการจองโต๊ะ
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
